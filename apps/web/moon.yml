$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
stack: 'frontend'
project:
  name: 'web'
  description: 'React client. Reads contracts and each plugin''s client half; nothing else.'

dependsOn:
  - contracts
  - plugin-ui
  - plugin-code-review
  - plugin-podcast

tags:
  - 'app'

tasks:
  dev:
    command: 'vite'
    preset: 'server'
    options:
      cache: false
      persistent: true
  build:
    command: 'bun run vite build'
    inputs:
      - '@group(sources)'
      - 'index.html'
      - 'vite.config.ts'
    outputs:
      - 'dist'
