$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'typescript'
stack: 'backend'
project:
  name: 'api'
  description: 'NestJS host for every bounded context. Adding a client never touches this app.'

dependsOn:
  - plugin-api
  - plugin-host
  - plugin-calendar
  - plugin-chat
  - plugin-code-review
  - plugin-documents
  - plugin-local-sources
  - plugin-issue-tracker
  - plugin-mail
  - kernel
  - contracts
  - loops
  - planning
  - integrations
  - signals
  - orchestration
  - persistence
  - reasoning
  - connectors-composio
  - connectors-local
  - connectors-elevenlabs
  - connectors-studio
  - podcast

tags:
  - 'app'

tasks:
  # Run from the workspace root so the single root `.env` is the only place configuration lives.
  dev:
    command: 'bun --watch apps/api/src/main.ts'
    preset: 'server'
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
  start:
    command: 'bun apps/api/src/main.ts'
    preset: 'server'
    options:
      cache: false
      persistent: true
      runFromWorkspaceRoot: true
  tick:
    command: 'bun apps/api/src/tick-once.ts'
    preset: 'server'
    options:
      cache: false
      runFromWorkspaceRoot: true
