$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Each library is one bounded context (or one adapter for a context). Apps are just clients:
# every rule that matters lives in libs/, so a second client — CLI, mobile, MCP server — is a
# new entry here and nothing else.
projects:
  kernel: 'libs/kernel'
  loops: 'libs/loops'
  planning: 'libs/planning'
  integrations: 'libs/integrations'
  signals: 'libs/signals'
  reasoning: 'libs/reasoning'
  persistence: 'libs/persistence'
  connectors-composio: 'libs/connectors-composio'
  connectors-local: 'libs/connectors-local'
  orchestration: 'libs/orchestration'
  contracts: 'libs/contracts'
  plugin-api: 'libs/plugin-api'
  plugin-host: 'libs/plugin-host'
  plugin-nest: 'libs/plugin-nest'
  plugin-ui: 'libs/plugin-ui'
  plugin-code-review: 'plugins/code-review'
  plugin-issue-tracker: 'plugins/issue-tracker'
  plugin-chat: 'plugins/chat'
  plugin-mail: 'plugins/mail'
  plugin-calendar: 'plugins/calendar'
  plugin-documents: 'plugins/documents'
  plugin-local-sources: 'plugins/local-sources'
  plugin-podcast: 'plugins/podcast'
  plugin-reasoning-claude-code: 'plugins/reasoning-claude-code'
  plugin-reasoning-ai-sdk: 'plugins/reasoning-ai-sdk'
  plugin-template: 'plugins/template'
  api: 'apps/api'
  scheduler: 'apps/scheduler'
  web: 'apps/web'

vcs:
  client: 'git'
  defaultBranch: 'main'

pipeline:
  inheritColorsForPipedTasks: true

telemetry: false
