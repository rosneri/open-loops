$schema: 'https://moonrepo.dev/schemas/tasks.json'

# Inherited by every project. A task defined here can still be overridden per project.
fileGroups:
  sources:
    - 'src/**/*'
  tests:
    - 'src/**/*.test.ts'
    - 'tests/**/*'
  configs:
    - '*.json'
    - '*.ts'

tasks:
  typecheck:
    command: 'tsc --noEmit -p tsconfig.json'
    inputs:
      - '@group(sources)'
      - 'tsconfig.json'
    options:
      runDepsInParallel: true

  test:
    command: 'vitest run --passWithNoTests'
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - 'vitest.config.ts'

  lint:
    command: 'eslint src --max-warnings 0'
    inputs:
      - '@group(sources)'
      - '/eslint.config.mjs'
